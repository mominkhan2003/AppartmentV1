name: Deploy to Namecheap

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NAMECHEAP_APP_CONFIG_DIR: ${{ vars.NAMECHEAP_APP_CONFIG_DIR }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Namecheap package
        run: npm run deploy:namecheap

      - name: Upload to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NAMECHEAP_FTP_SERVER }}
          username: ${{ secrets.NAMECHEAP_FTP_USERNAME }}
          password: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
          server-dir: ${{ secrets.NAMECHEAP_FTP_SERVER_DIR }}
          local-dir: ./namecheap-deploy/
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
